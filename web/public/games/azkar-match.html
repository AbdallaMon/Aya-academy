<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ذاكرة الأذكار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="kit.css" />
  <style>
    .mgrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 4px;
      perspective: 900px;
      flex: 1;
      align-content: center;
    }
    .mcard {
      position: relative;
      aspect-ratio: 3 / 4;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(.5,.05,.4,1.4);
      transform: rotateY(180deg); /* shows back by default */
      border-radius: 16px;
    }
    .mcard.flipped { transform: rotateY(0deg); }
    .mcard.matched { animation: matchGlow 1s ease forwards; cursor: default; }
    .mcard.locked { pointer-events: none; }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px;
      text-align: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 6px 14px rgba(70,50,140,0.16);
      overflow: hidden;
    }
    /* front = the content; visible at rotateY(0) */
    .front {
      background: #fff;
      border: 3px solid var(--line);
    }
    .front .em { font-size: clamp(26px, 8vw, 40px); line-height: 1; }
    .front .lbl {
      font-weight: 900;
      font-size: clamp(11px, 3.4vw, 14px);
      line-height: 1.4;
      color: var(--ink);
    }
    .mcard.sit .front { background: #fff7e6; border-color: #ffe2a6; }
    .mcard.sit .front .lbl { color: var(--warn); }
    .mcard.dua .front { background: #f1ecff; border-color: #d8caff; }
    .mcard.dua .front .lbl { color: var(--primary-d); }
    .mcard.matched .front { border-color: var(--green); background: var(--good-bg); }

    /* back = the face-down cover; visible at rotateY(180) */
    .back {
      transform: rotateY(180deg);
      background: linear-gradient(150deg, #8a5bff, #ff5fa2);
      color: #fff;
    }
    .back .q { font-size: clamp(28px, 9vw, 44px); animation: bob 3s ease-in-out infinite; }
    .back .dot { font-size: 10px; letter-spacing: 3px; opacity: .85; margin-top: 2px; }

    .heart {
      position: absolute;
      top: 4px;
      inset-inline-end: 6px;
      font-size: 18px;
      opacity: 0;
      transform: scale(0.4);
      z-index: 3;
    }
    .mcard.matched .heart { animation: heartPop 0.6s ease forwards; }

    @keyframes matchGlow {
      0% { transform: rotateY(0) scale(1); }
      35% { transform: rotateY(0) scale(1.12); }
      100% { transform: rotateY(0) scale(1); }
    }
    @keyframes heartPop {
      0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
      60% { opacity: 1; transform: scale(1.4) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
  </style>
</head>
<body>
  <div class="brand">Aya Academy ✦</div>
  <a class="home-link" href="index.html">كل الألعاب ←</a>

  <div class="phone">
    <div class="screen">
      <div class="hdr">
        <div class="title">
          <b>ذاكرة الأذكار</b>
          <span>طابِق الموقف مع الذِّكر 💚</span>
        </div>
        <div class="ava">🧠</div>
      </div>

      <div class="hbar">
        <button class="sound" id="sound" aria-label="الصوت">🔊</button>
        <div class="stars" id="stars"></div>
        <div class="badge" id="score">0 / 4 ⭐</div>
      </div>

      <div class="guide" id="guide">
        <div class="gava" id="gava">🐥</div>
        <div class="txt" id="guideTxt">اقلِب بطاقتين وابحث عن الزوج الصحيح!</div>
      </div>

      <div class="body">
        <div class="mgrid" id="grid"></div>
        <button class="btn ghost" id="restart" style="margin-top:14px">إعادة اللعب 🔄</button>
      </div>

      <div class="foot">ألعاب أيا التعليمية ✦ تعلّم الأذكار باللعب</div>
    </div>
  </div>

  <script src="kit.js"></script>
  <script>
    (function () {
      var soundBtn = document.getElementById("sound");
      AyaKit.wireMute(soundBtn);

      var grid = document.getElementById("grid");
      var starsEl = document.getElementById("stars");
      var scoreEl = document.getElementById("score");
      var guide = document.getElementById("guide");
      var guideTxt = document.getElementById("guideTxt");
      var gava = document.getElementById("gava");
      var restartBtn = document.getElementById("restart");

      var TOTAL = 4;

      // each pair shares an id; "sit" = situation, "dua" = the matching ذكر
      var PAIRS = [
        { id: 1, sit: { em: "🍽️", lbl: "قبل الأكل" }, dua: { em: "🤲", lbl: "بِسْمِ الله" } },
        { id: 2, sit: { em: "😋", lbl: "بعد الأكل" }, dua: { em: "🤲", lbl: "الحَمْدُ لله" } },
        { id: 3, sit: { em: "😴", lbl: "قبل النوم" }, dua: { em: "🤲", lbl: "باسمك اللهم أحيا وأموت" } },
        { id: 4, sit: { em: "🕌", lbl: "دخول المسجد" }, dua: { em: "🤲", lbl: "اللهم افتح لي أبواب رحمتك" } }
      ];

      var GOOD = ["أحسنت! زوج صحيح 🌟", "رائع يا بطل! 💚", "ممتاز! ذكر صحيح ✨", "ما شاء الله! 👏"];
      var BAD = ["جرّب مرة أخرى يا حبيبي 💛", "لا بأس! حاول مرة ثانية 😊", "قريب! اقلب غيرها 🌈"];

      var matched = 0;
      var firstCard = null;
      var busy = false;

      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }

      function setGuide(cls, msg, emoji) {
        guide.className = "guide" + (cls ? " " + cls : "");
        guideTxt.textContent = msg;
        if (emoji) gava.textContent = emoji;
      }

      function buildDeck() {
        var deck = [];
        PAIRS.forEach(function (p) {
          deck.push({ pairId: p.id, kind: "sit", em: p.sit.em, lbl: p.sit.lbl });
          deck.push({ pairId: p.id, kind: "dua", em: p.dua.em, lbl: p.dua.lbl });
        });
        return shuffle(deck);
      }

      function newGame() {
        matched = 0;
        firstCard = null;
        busy = false;
        grid.innerHTML = "";
        AyaKit.renderStars(starsEl, 0, TOTAL);
        scoreEl.textContent = "0 / " + TOTAL + " ⭐";
        setGuide("", "اقلِب بطاقتين وابحث عن الزوج الصحيح!", "🐥");

        var deck = buildDeck();
        deck.forEach(function (c, idx) {
          var card = document.createElement("div");
          card.className = "mcard " + c.kind;
          card.dataset.pair = c.pairId;
          card.dataset.kind = c.kind;

          card.innerHTML =
            '<div class="heart">💚</div>' +
            '<div class="face front"><div class="em">' + c.em + '</div><div class="lbl">' + c.lbl + '</div></div>' +
            '<div class="face back"><div class="q">❓</div><div class="dot">• • •</div></div>';

          // pop-in entrance
          card.style.opacity = "0";
          card.style.animation = "pop 0.4s ease forwards";
          card.style.animationDelay = (idx * 0.06) + "s";
          setTimeout((function (cc) {
            return function () { cc.style.opacity = ""; };
          })(card), 400 + idx * 60);

          card.addEventListener("click", function () { onCardClick(card); });
          grid.appendChild(card);
        });
      }

      function onCardClick(card) {
        if (busy) return;
        if (card.classList.contains("matched")) return;
        if (card.classList.contains("flipped")) return;

        AyaKit.sound.tap();
        card.classList.add("flipped");

        if (!firstCard) {
          firstCard = card;
          return;
        }

        // second card
        var a = firstCard;
        var b = card;
        busy = true;

        if (a.dataset.pair === b.dataset.pair && a.dataset.kind !== b.dataset.kind) {
          // MATCH
          setTimeout(function () {
            a.classList.add("matched");
            b.classList.add("matched");
            AyaKit.sound.correct();
            AyaKit.sound.star();

            var r = b.getBoundingClientRect();
            AyaKit.burst("💚", r.left + r.width / 2, r.top + r.height / 2);
            AyaKit.confetti(14);

            matched++;
            AyaKit.renderStars(starsEl, matched, TOTAL);
            scoreEl.textContent = matched + " / " + TOTAL + " ⭐";
            setGuide("good", GOOD[Math.floor(Math.random() * GOOD.length)], "🤩");

            firstCard = null;
            busy = false;

            if (matched === TOTAL) {
              setTimeout(winGame, 600);
            }
          }, 350);
        } else {
          // NO MATCH — gentle flip back, no penalty, unlimited tries
          AyaKit.sound.wrong();
          AyaKit.shake(b);
          setGuide("bad", BAD[Math.floor(Math.random() * BAD.length)], "😢");
          setTimeout(function () {
            a.classList.remove("flipped");
            b.classList.remove("flipped");
            firstCard = null;
            busy = false;
            setGuide("", "اقلِب بطاقتين وابحث عن الزوج الصحيح!", "🐥");
          }, 950);
        }
      }

      function winGame() {
        AyaKit.sound.win();
        AyaKit.confetti(34);
        setGuide("good", "أكملت كل الأزواج! ما شاء الله 🎉", "👑");

        var ov = document.createElement("div");
        ov.className = "overlay";
        ov.innerHTML =
          '<div class="cert">' +
          '<div class="crown">👑</div>' +
          '<h3>بطل الأذكار الذكي!</h3>' +
          '<p>طابقت كل الأذكار مع مواقفها<br>أنت تتذكر أذكارك أحسن تذكُّر 💚</p>' +
          '<div class="who"><small>هذه الشهادة لـ</small>بطل / بطلة الأذكار</div>' +
          '<button class="btn green" id="certClose">شكراً! 🎉</button>' +
          '</div>';
        document.querySelector(".screen").appendChild(ov);
        document.getElementById("certClose").addEventListener("click", function () {
          ov.remove();
        });
      }

      restartBtn.addEventListener("click", function () {
        AyaKit.sound.pop();
        var ov = document.querySelector(".overlay");
        if (ov) ov.remove();
        newGame();
      });

      newGame();
    })();
  </script>
</body>
</html>
