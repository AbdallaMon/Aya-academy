<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ألعاب أكاديمية آية — العب وتعلّم!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { align-items: flex-start; }
      .wrap { width: 980px; max-width: 100%; margin: 0 auto; }
      .head { text-align: center; margin: 40px 0 22px; }
      .head .big { font-size: 56px; }
      .head h1 { color: var(--primary); font-size: 30px; margin: 8px 0 4px; }
      .head p { color: var(--muted); margin: 0; font-weight: 700; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding-bottom: 50px; }
      .game {
        background: #fff; border-radius: 24px; padding: 22px; text-decoration: none; color: inherit;
        box-shadow: var(--shadow); border: 3px solid transparent; transition: transform 0.18s, border-color 0.18s;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .game:hover { transform: translateY(-6px); border-color: #d8ccff; }
      .game .e { font-size: 56px; }
      .game h3 { margin: 10px 0 4px; color: var(--ink); font-size: 20px; }
      .game p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.6; min-height: 42px; }
      .game .go { background: linear-gradient(180deg,#8a5bff,var(--primary-d)); color: #fff; font-weight: 900; border-radius: 14px; padding: 12px 18px; width: 100%; }
      .tag { font-size: 11px; font-weight: 800; color: var(--primary-d); background: #f1ecff; border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="big">🎮🕌</div>
        <h1>ألعاب أكاديمية آية</h1>
        <p>العب وتعلّم آداب الإسلام بطريقة ممتعة! ✨</p>
      </div>
      <div class="cards" id="cards"></div>
    </div>
    <script src="kit.js"></script>
    <script>
      const GAMES = [
        { e: "📱", t: "آداب الاتصال الذكي", d: "تعلّم آداب المكالمات والكلام المهذب مع البطل عبود!", tag: "محادثة", f: "phone-manners.html" },
        { e: "🚀", t: "صاروخ الحسنات", d: "التقط الأعمال الصالحة الطايرة واملأ صاروخ الحسنات!", tag: "سرعة", f: "good-deeds-catch.html" },
        { e: "💧", t: "بطل الوضوء", d: "رتّب خطوات الوضوء الصحيحة وكن بطلاً نظيفاً!", tag: "ترتيب", f: "wudu-steps.html" },
        { e: "🃏", t: "ذاكرة الأذكار", d: "طابِق كل موقف بالدعاء المناسب له في لعبة الذاكرة!", tag: "ذاكرة", f: "azkar-match.html" },
        { e: "🕌", t: "نجوم الأركان", d: "ابنِ أركان الإسلام الخمسة واصنع مسجدك الجميل!", tag: "بناء", f: "pillars-build.html" },
      ];
      const wrap = document.getElementById("cards");
      GAMES.forEach((g) => {
        const a = document.createElement("a");
        a.className = "game";
        a.href = g.f;
        const e = document.createElement("div"); e.className = "e is-float"; e.textContent = g.e;
        const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = g.tag;
        const h = document.createElement("h3"); h.textContent = g.t;
        const p = document.createElement("p"); p.textContent = g.d;
        const go = document.createElement("div"); go.className = "go"; go.textContent = "هيا نلعب! ▶";
        a.append(e, tag, h, p, go);
        wrap.appendChild(a);
      });
    </script>
  </body>
</html>
