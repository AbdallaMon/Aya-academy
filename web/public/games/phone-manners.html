<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>مغامرة آداب الاتصال الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* ===== game-specific styles (reuse kit classes where possible) ===== */

      /* avatar grid */
      .pick {
        border: 2px solid var(--line); border-radius: 18px; padding: 14px 8px;
        text-align: center; cursor: pointer; background: #fff; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
      .pick:hover { border-color: #cbbcff; transform: translateY(-3px); }
      .pick.sel { border-color: var(--primary); box-shadow: 0 0 0 4px #efe9ff; }
      .pick .e { font-size: 34px; display: inline-block; animation: bob 3s ease-in-out infinite; }
      .pick.sel .e { animation: wiggle 0.6s ease-in-out infinite; }
      .pick .n { font-weight: 800; margin-top: 6px; font-size: 14px; }
      .pick .d { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.4; }

      /* dialpad */
      .display {
        background: #f3f1ff; border: 2px solid var(--line); border-radius: 16px;
        height: 70px; display: flex; align-items: center; justify-content: center;
        gap: 14px; margin: 6px 0 14px; font-size: 30px; letter-spacing: 8px; color: var(--primary);
        font-weight: 900;
      }
      .dot { width: 16px; height: 16px; border-radius: 50%; background: #d7cffb; transition: 0.2s; }
      .dot.on { background: var(--primary); transform: scale(1.15); }
      .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .key {
        background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 16px 0;
        font-size: 22px; font-weight: 900; cursor: pointer; color: var(--ink); font-family: inherit;
        transition: transform 0.1s, background 0.1s;
      }
      .key:active { transform: scale(0.94); background: #f3f1ff; }
      .key.call { background: linear-gradient(180deg, #20cf99, var(--green-d)); color: #fff; border-color: transparent; }
      .key.call.ready { animation: pulse 1.2s ease-in-out infinite; }
      .key.del { background: var(--bad-bg); color: var(--bad); border-color: #ffd5de; font-size: 15px; }

      .scenario {
        background: var(--warn-bg); border: 2px solid #ffe2a6; border-radius: 16px;
        padding: 14px; font-weight: 800; font-size: 14px; line-height: 1.7; margin-bottom: 4px;
        display: flex; gap: 10px; align-items: center;
      }
      .person-box {
        background: var(--bad-bg); border-radius: 16px; padding: 18px; text-align: center;
        margin-bottom: 6px;
      }
      .person-box .e { font-size: 52px; display: inline-block; animation: bob 2.6s ease-in-out infinite; }
      .person-box .c { color: var(--pink); font-weight: 800; font-size: 13px; margin-top: 6px; }

      /* tone slider */
      .tone {
        background: #faf9ff; border: 2px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 8px;
      }
      .bars { display: flex; gap: 5px; justify-content: center; align-items: flex-end; height: 40px; }
      .bars i {
        width: 7px; background: var(--green); border-radius: 4px; display: inline-block;
        transition: height 0.15s, background 0.15s;
      }
      .tone .face { font-size: 60px; text-align: center; margin: 8px 0; }
      .tone .desc { text-align: center; font-weight: 800; font-size: 13px; min-height: 38px; line-height: 1.5; }
      input[type="range"] { width: 100%; accent-color: var(--primary); height: 30px; }
      .zones { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }

      /* studio */
      .studio-row { font-weight: 800; font-size: 13px; margin: 14px 0 8px; }
      .colors { display: flex; gap: 10px; }
      .sw { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 2px #e6e2fb; position: relative; transition: transform 0.1s; }
      .sw:active { transform: scale(0.9); }
      .sw.sel::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 900; }
      .stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .stk { border: 2px solid var(--line); border-radius: 12px; padding: 10px 0; font-size: 22px; cursor: pointer; background: #fff; transition: transform 0.1s; }
      .stk:active { transform: scale(0.92); }
      .studio-wrap { display: grid; grid-template-columns: 1fr 150px; gap: 14px; align-items: start; }
      .preview {
        border-radius: 26px; height: 250px; padding: 12px; position: relative; overflow: hidden;
        box-shadow: inset 0 0 0 4px rgba(0,0,0,0.06); transition: background 0.2s;
      }
      .preview .notch { width: 50px; height: 6px; border-radius: 6px; background: rgba(0,0,0,0.25); margin: 4px auto 12px; }
      .preview .label { background: rgba(255,255,255,0.92); border-radius: 12px; padding: 8px; text-align: center; font-size: 11px; font-weight: 800; color: var(--ink); }
      .preview .stk-layer { position: absolute; inset: 0; pointer-events: none; }
      .preview .stk-layer span { position: absolute; font-size: 26px; animation: bob 2.8s ease-in-out infinite; }
      .preview .callbtn { position: absolute; bottom: 14px; inset-inline-start: 50%; transform: translateX(50%); width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: grid; place-items: center; font-size: 24px; animation: pulse 1.6s ease-in-out infinite; }

      .opt.correct .ic { animation: starpop 0.5s; }
    </style>
  </head>
  <body>
    <div class="brand">Aya Academy ✦</div>
    <a class="home-link" href="index.html">كل الألعاب ←</a>

    <div class="phone">
      <div class="screen">
        <div class="hdr">
          <div class="title">
            <b id="hTitle">البطل عبود الخارق</b>
            <span>مغامرة آداب الاتصال الذكي 📱</span>
          </div>
          <div class="ava" id="hAva">🦸</div>
        </div>

        <div class="hbar">
          <button class="sound" id="soundBtn" title="الصوت">🔊</button>
          <div class="stars" id="stars"></div>
          <div class="badge"><span id="score">0</span> / 6 ⭐</div>
        </div>

        <div class="guide" id="guide">
          <div class="gava" id="gAva">🦸</div>
          <div class="txt" id="gTxt"></div>
        </div>

        <div class="body" id="body"></div>

        <div class="foot">🔊 لعبة تفاعلية بأصوات تشجيعية لطيفة للأطفال</div>
      </div>
    </div>

    <script src="kit.js"></script>
    <script>
      // ───────────────────────── data ─────────────────────────
      const AVATARS = [
        { id: "explorer", emoji: "🧑‍🚀", name: "مستكشف", hero: "عبود مستكشف الفضاء", desc: "يبحث عن آداب الهاتف في النجوم!" },
        { id: "hero", emoji: "🦸", name: "عبود", hero: "البطل عبود الخارق", desc: "يرتدي رداء الأبطال السحري!" },
        { id: "cowboy", emoji: "🤠", name: "راعي", hero: "عبود راعي المدينة", desc: "أسرع هاتف مهذب في المدينة!" },
        { id: "diver", emoji: "🤿", name: "غواص", hero: "عبود غواص الأعماق", desc: "يكتشف آداب الاتصال تحت الماء!" },
      ];

      // each task awards exactly one star. type drives the renderer.
      const TASKS = [
        {
          type: "dial-then-choice",
          icon: "👩",
          title: "المهمة 1: الاتصال بماما الحبيبة",
          dialPrompt: "ساعد عبود في الاتصال بماما! اضغط على الأرقام بالترتيب: 5 ثم 5 ثم 5 ثم 5، ثم اضغط الزر الأخضر 📞",
          sequence: ["5", "5", "5", "5"],
          choicePrompt: "ترن.. ترن! ماما تجيب بلطف: «السلام عليكم، أهلاً يا عبود!» ماذا يقول عبود؟ 🤔",
          choiceCenter: { emoji: "👩", caption: "ماما تبتسم وتنتظر رد عبود!" },
          choiceHint: "اختر الرد المهذب الذي يفرح قلب ماما:",
          options: [
            { v: "warn", ic: "⚠️", t: "«ألو ماما! أحضري لي اللعبة الآن وبسرعة!»", correct: false },
            { v: "good", ic: "💚", t: "«وعليكم السلام يا أمي الحبيبة، أنا عبود، كيف حالك اليوم؟»", correct: true },
            { v: "bad", ic: "📢", t: "«ألووو! ألووو! اسمعيني ألووو!» (بصراخ)", correct: false },
          ],
          good: "رائع! هذا هو الرد الذهبي المهذب الذي يفرح قلب ماما! 💛",
          bad: "لا بأس يا بطل! نبدأ دائماً بالسلام ونسأل عن الحال بلطف. جرّب مرة أخرى 😊",
        },
        {
          type: "tone",
          icon: "🗣️",
          title: "المهمة 2: نبرة صوت عبود الذهبية",
          prompt: "حرّك الزر لتختار النبرة المناسبة — صوت معتدل يحبه الجميع! اجعله في المنتصف 😊",
          good: "رائع! هذا هو الصوت الذهبي المريح المناسب للمكالمات! ✨",
          bad: "لا بأس! لا همس خافت ولا صراخ. اسحب الزر للمنتصف عند الوجه السعيد 😊",
        },
        {
          type: "choice",
          icon: "🤫",
          title: "المهمة 3: الهاتف وقت الصلاة",
          subtitle: "حان وقت الصلاة في المسجد. ماذا نفعل بالهاتف؟",
          prompt: "اختر التصرف المهذب وقت الصلاة:",
          options: [
            { v: "good", ic: "🤫", t: "نجعله صامتاً ونضعه جانباً باحترام، فالصلاة أهم شيء.", correct: true },
            { v: "warn", ic: "🔊", t: "نتركه يرن بصوت عالٍ لنسمع من يتصل بنا.", correct: false },
            { v: "bad", ic: "🎮", t: "نلعب به ونتكلم بصوت مرتفع داخل المسجد.", correct: false },
          ],
          good: "أحسنت! نسكت الهاتف ونضعه جانباً باحترام وقت الصلاة. هذا أدب جميل! 🕌✨",
          bad: "لا بأس يا بطل! وقت الصلاة نجعل الهاتف صامتاً ونضعه جانباً. جرّب مرة أخرى 😊",
        },
        {
          type: "choice",
          icon: "👵",
          title: "المهمة 4: الرد على الجدة بحب",
          subtitle: "جدتك الحبيبة تتصل بك وتقول: «السلام عليكم يا حبيبي!»",
          scenario: "📞👵 «السلام عليكم يا حبيبي! كيف حالك؟»",
          prompt: "اختر الرد المليء بالحب لجدتك:",
          options: [
            { v: "good", ic: "💖", t: "«وعليكم السلام يا جدتي الحبيبة، اشتقت إليكِ!»", correct: true },
            { v: "warn", ic: "😐", t: "«نعم؟ ماذا تريدين؟ أنا مشغول الآن.»", correct: false },
            { v: "bad", ic: "🙉", t: "لا نرد عليها ونغلق الهاتف بسرعة.", correct: false },
          ],
          good: "ما أجملك! ردّك بحب يُسعد قلب جدتك كثيراً. الجدة كنز نحبه! 👵💕",
          bad: "لا بأس! نرد على جدتنا بالسلام وبكلمات لطيفة مليئة بالحب. جرّب مرة أخرى 😊",
        },
        {
          type: "choice",
          icon: "🤔",
          title: "المهمة 5: المتصل المخطئ",
          subtitle: "شخص يتصل بالخطأ ويظنك صديقه سامر.",
          scenario: "📞👤 «أهلاً يا سامر! هل تلعب معي اليوم؟»",
          prompt: "اختر الرد المهذب للمتصل المخطئ:",
          options: [
            { v: "good", ic: "💖", t: "«عذراً يا صديقي، أظن أنك أخطأت في الرقم، أنا عبود ولست سامر. مع السلامة!»", correct: true },
            { v: "warn", ic: "🙂", t: "نغلق الخط مباشرة دون أن نوضح له شيئاً.", correct: false },
            { v: "bad", ic: "😠", t: "نصرخ فيه: «أنت مزعج، لا تتصل بنا مجدداً!»", correct: false },
          ],
          good: "يا لك من بطل لطيف! توضيح الخطأ بأدب وقول مع السلامة من شيم الأبطال! 🏆✨",
          bad: "لا بأس! نوضّح الخطأ بلطف ونقول مع السلامة. جرّب مرة أخرى يا بطل 😊",
        },
        {
          type: "choice",
          icon: "👋",
          title: "المهمة 6: آداب إنهاء المكالمة",
          subtitle: "انتهت المكالمة الجميلة. كيف نودّع بأدب؟",
          prompt: "اختر طريقة إنهاء المكالمة بأدب:",
          options: [
            { v: "good", ic: "💚", t: "«مع السلامة، في أمان الله!» ثم نغلق الهاتف بلطف.", correct: true },
            { v: "warn", ic: "🤐", t: "نغلق الهاتف فجأة دون أن نقول أي كلمة.", correct: false },
            { v: "bad", ic: "📢", t: "نصرخ «خلاص! وداعاً!» ونرمي الهاتف.", correct: false },
          ],
          good: "أحسنت! نختم بكلمات لطيفة: «مع السلامة، في أمان الله!» 👋💛",
          bad: "لا بأس! نودّع بلطف ونقول «مع السلامة، في أمان الله». جرّب مرة أخرى 😊",
        },
      ];

      const COVER_COLORS = ["#FFC107", "#22C55E", "#3B82F6", "#EC4899", "#8B5CF6"];
      const STICKERS = ["⭐", "👑", "🚀", "🐱", "🍩", "🐼", "🐎", "🦄"];
      const TOTAL = TASKS.length;

      // ───────────────────────── state ─────────────────────────
      const state = {
        avatar: AVATARS[1],
        screen: "avatar", // 'avatar' | number(taskIndex) | 'studio'
        sub: "intro",
        stars: 0,
        dialed: [],
        tone: 50,
        studio: { color: COVER_COLORS[4], stickers: [] },
      };

      const $ = (id) => document.getElementById(id);
      const body = $("body");

      // ───────────────────────── header / guide ─────────────────────────
      function setGuide(text, mood) {
        const g = $("guide");
        g.className = "guide" + (mood === "good" ? " good" : mood === "bad" ? " bad" : "");
        $("gTxt").textContent = text;
        $("gAva").textContent = mood === "bad" ? "😢" : state.avatar.emoji;
      }
      function renderHeader() {
        $("hTitle").textContent = state.avatar.hero;
        $("hAva").textContent = state.avatar.emoji;
        $("score").textContent = state.stars;
        AyaKit.renderStars($("stars"), state.stars, TOTAL);
      }

      // ───────────────────────── screens ─────────────────────────
      function render() {
        renderHeader();
        if (state.screen === "avatar") return renderAvatar();
        if (state.screen === "studio") return renderStudio();
        return renderTask(TASKS[state.screen]);
      }

      function renderAvatar() {
        setGuide(`يا سلام! اخترت مظهر «${state.avatar.hero}»! اضغط الزر الأخضر لتبدأ أول مغامرة! 🚀`);
        body.innerHTML = `
          <div class="hero-emoji">${state.avatar.emoji}</div>
          <div class="h-title">مغامرات البطل عبود</div>
          <div class="h-sub">اختر مظهر عبود لتبدأ المغامرات!</div>
          <div class="hint">انقر لتختار مظهر عبود:</div>
          <div class="grid2" id="picks"></div>
          <div class="note">🏆 اجمع ٦ نجوم أدب سحرية وافتح استوديو تصميم الهواتف!</div>
          <button class="btn green" id="start">هيا نطير للمغامرة الأولى! 🚀</button>
        `;
        const picks = $("picks");
        AVATARS.forEach((a) => {
          const d = document.createElement("div");
          d.className = "pick" + (a.id === state.avatar.id ? " sel" : "");
          d.innerHTML = `<div class="e">${a.emoji}</div><div class="n">${a.name}</div><div class="d">${a.desc}</div>`;
          d.onclick = () => { AyaKit.sound.pick(); state.avatar = a; render(); };
          picks.appendChild(d);
        });
        $("start").onclick = () => { AyaKit.sound.tap(); startTask(0); };
      }

      function startTask(i) {
        state.screen = i;
        state.tone = 50;
        state.dialed = [];
        state.sub = TASKS[i].type === "dial-then-choice" ? "dial" : "main";
        render();
      }

      function awardStarAndNext() {
        state.stars += 1;
        AyaKit.sound.correct();
        AyaKit.sound.star();
        AyaKit.confetti(28);
        AyaKit.burst("⭐", window.innerWidth / 2, window.innerHeight / 2.4);
        renderHeader();
        const next = state.screen + 1;
        const t = TASKS[state.screen];
        setGuide(t.good, "good");
        const cta = document.createElement("button");
        cta.className = "btn orange is-pop";
        cta.textContent = next < TASKS.length ? "للمهمة التالية ←" : "افتح استوديو الهاتف الذهبي! 🏆 ←";
        cta.onclick = () => {
          AyaKit.sound.tap();
          if (next < TASKS.length) startTask(next);
          else { state.screen = "studio"; render(); }
        };
        body.appendChild(cta);
      }

      function wrong(badText, el) {
        AyaKit.sound.wrong();
        setGuide(badText, "bad");
        AyaKit.shake(el);
      }

      function renderTask(task) {
        if (task.type === "dial-then-choice" && state.sub === "dial") return renderDial(task);
        if (task.type === "tone") return renderTone(task);
        return renderChoice(task);
      }

      // -- dialpad --
      function renderDial(task) {
        setGuide(task.dialPrompt);
        body.innerHTML = `
          <div class="hero-emoji">${task.icon}</div>
          <div class="h-title">${task.title}</div>
          <div class="display" id="disp"></div>
          <div class="pad" id="pad"></div>
        `;
        drawDots();
        const pad = $("pad");
        const keys = ["3","2","1","6","5","4","9","8","7","call","0","del"];
        keys.forEach((k) => {
          const b = document.createElement("button");
          if (k === "call") { b.className = "key call"; b.textContent = "📞"; b.id = "callKey"; }
          else if (k === "del") { b.className = "key del"; b.textContent = "✖ مسح"; }
          else { b.className = "key"; b.textContent = k; }
          b.onclick = () => onKey(k, task, b);
          pad.appendChild(b);
        });
        updateCallReady(task);
      }
      function drawDots() {
        const need = TASKS[state.screen].sequence.length;
        $("disp").innerHTML = Array.from({ length: need })
          .map((_, i) => `<span class="dot ${i < state.dialed.length ? "on" : ""}"></span>`).join("");
      }
      function updateCallReady(task) {
        const ck = $("callKey");
        if (!ck) return;
        ck.classList.toggle("ready", state.dialed.join("") === task.sequence.join(""));
      }
      function onKey(k, task, btn) {
        if (k === "del") { AyaKit.sound.tap(); state.dialed.pop(); drawDots(); return updateCallReady(task); }
        if (k === "call") {
          const ok = state.dialed.join("") === task.sequence.join("");
          if (ok) { AyaKit.sound.win(); AyaKit.confetti(16); state.sub = "choice"; render(); }
          else { wrong("لا بأس! اكتب الرقم أولاً: 5 5 5 5 ثم اضغط الزر الأخضر 📞", $("disp")); }
          return;
        }
        if (state.dialed.length >= task.sequence.length) {
          AyaKit.sound.wrong();
          AyaKit.shake($("disp"));
          setGuide("اكتمل الرقم! اضغط الزر الأخضر 📞 للاتصال 😊", "bad");
          return;
        }
        AyaKit.sound.tap();
        AyaKit.pop(btn);
        state.dialed.push(k);
        drawDots();
        updateCallReady(task);
      }

      // -- multiple choice (and dial step 2) --
      function renderChoice(task) {
        const isStep2 = task.type === "dial-then-choice";
        const prompt = isStep2 ? task.choicePrompt : task.prompt;
        setGuide(prompt);
        let center = "";
        if (isStep2) {
          center = `<div class="person-box"><div class="e">${task.choiceCenter.emoji}</div><div class="c">${task.choiceCenter.caption}</div></div>`;
        } else {
          center = `<div class="hero-emoji">${task.icon}</div><div class="h-title">${task.title}</div>${task.subtitle ? `<div class="h-sub">${task.subtitle}</div>` : ""}`;
        }
        const scenario = task.scenario ? `<div class="scenario">${task.scenario}</div>` : "";
        const hintText = isStep2 ? task.choiceHint : task.prompt;
        body.innerHTML = `${center}${scenario}<div class="hint">${hintText}</div><div id="opts"></div>`;
        const opts = $("opts");
        task.options.forEach((o) => {
          const d = document.createElement("div");
          d.className = "opt " + o.v + " is-pop";
          d.innerHTML = `<span class="ic">${o.ic}</span><span>${o.t}</span>`;
          d.onclick = () => {
            if (o.correct) { d.classList.add("correct"); awardStarAndNext(); }
            else wrong(task.bad, d);
          };
          opts.appendChild(d);
        });
      }

      // -- tone slider --
      function renderTone(task) {
        setGuide(task.prompt);
        body.innerHTML = `
          <div class="hero-emoji">${task.icon}</div>
          <div class="h-title">${task.title}</div>
          <div class="tone">
            <div class="bars" id="bars"></div>
            <div class="face" id="face">😊</div>
            <div class="desc" id="desc"></div>
            <input type="range" id="slider" min="0" max="100" value="${state.tone}" />
            <div class="zones"><span>همس خافت 🤫</span><span>معتدل 😊</span><span>صراخ 📢</span></div>
          </div>
          <button class="btn" id="confirm"></button>
        `;
        const sl = $("slider");
        sl.oninput = () => { state.tone = +sl.value; AyaKit.sound.tap(); paintTone(task); };
        paintTone(task);
      }
      function toneZone() {
        if (state.tone < 34) return "low";
        if (state.tone > 66) return "high";
        return "mid";
      }
      function paintTone(task) {
        const z = toneZone();
        const face = z === "mid" ? "😊" : z === "low" ? "🤫" : "😣";
        const desc =
          z === "mid" ? "صوت معتدل ومهذب وجميل (الكل يسمعك براحة!)" :
          z === "low" ? "صوت خافت جداً (الطرف الآخر لا يسمعك!)" :
          "صوت عالٍ ومزعج (يؤذي آذان الآخرين!)";
        $("face").textContent = face;
        $("desc").textContent = desc;
        $("desc").style.color = z === "mid" ? "var(--green-d)" : "var(--warn)";
        const bars = $("bars");
        const level = Math.round((state.tone / 100) * 7) + 1;
        bars.innerHTML = "";
        for (let i = 0; i < 8; i++) {
          const b = document.createElement("i");
          b.style.height = (i < level ? 10 + i * 4 : 6) + "px";
          b.style.background = z === "mid" ? "var(--green)" : z === "high" ? "var(--bad)" : "#c9c2ec";
          bars.appendChild(b);
        }
        const btn = $("confirm");
        if (z === "mid") { btn.className = "btn purple"; btn.textContent = "هذا صوتي الذهبي المعتدل! ✨"; }
        else { btn.className = "btn orange"; btn.textContent = "جرّب هذا الصوت 🔎"; }
        btn.onclick = () => {
          if (toneZone() === "mid") { awardStarAndNext(); }
          else wrong(task.bad, $("face").parentElement);
        };
      }

      // -- studio --
      function renderStudio() {
        const lastSticker = state.studio.stickers[state.studio.stickers.length - 1];
        setGuide(
          lastSticker
            ? `أضفت ملصق ${lastSticker} السحري إلى هاتف عبود! يمكنك إضافة حتى ٥ ملصقات!`
            : "أحسنت يا بطل! جمعت كل النجوم! صمّم الآن هاتفك الذهبي السحري! 🎉",
          "good"
        );
        body.innerHTML = `
          <div class="h-title">🏆 استوديو هاتف عبود الذهبي</div>
          <div class="h-sub">صمّم الغطاء، وركّب الملصقات، وجرّب زر الاتصال!</div>
          <div class="studio-wrap">
            <div>
              <div class="studio-row">١. اختر لون الغطاء:</div>
              <div class="colors" id="colors"></div>
              <div class="studio-row">٢. أضف ملصقاتك (حتى ٥):</div>
              <div class="stickers" id="stk"></div>
              <button class="btn ghost" id="clear" style="margin-top:10px">🗑 إزالة الملصقات</button>
            </div>
            <div class="preview" id="prev"></div>
          </div>
          <button class="btn grad" id="cert">شهادة البطل عبود 🏆</button>
          <button class="btn ghost" id="replay">إعادة اللعب 🔄</button>
        `;
        const cWrap = $("colors");
        COVER_COLORS.forEach((c) => {
          const s = document.createElement("div");
          s.className = "sw" + (c === state.studio.color ? " sel" : "");
          s.style.background = c;
          s.onclick = () => { AyaKit.sound.pick(); state.studio.color = c; render(); };
          cWrap.appendChild(s);
        });
        const sWrap = $("stk");
        STICKERS.forEach((e) => {
          const b = document.createElement("button");
          b.className = "stk"; b.textContent = e;
          b.onclick = () => {
            if (state.studio.stickers.length >= 5) {
              AyaKit.sound.wrong();
              setGuide("وصلت إلى ٥ ملصقات! امسح ملصقاً لتضيف غيره 😊", "bad");
              return;
            }
            AyaKit.sound.star(); state.studio.stickers.push(e); render();
          };
          sWrap.appendChild(b);
        });
        $("clear").onclick = () => { AyaKit.sound.tap(); state.studio.stickers = []; render(); };
        $("cert").onclick = () => { AyaKit.sound.win(); AyaKit.confetti(40); openCert(); };
        $("replay").onclick = () => { AyaKit.sound.tap(); resetGame(); };
        paintPreview();
      }
      function paintPreview() {
        const p = $("prev");
        p.style.background = state.studio.color;
        const positions = [[16, 60], [70, 40], [40, 78], [78, 72], [22, 30]];
        const layer = state.studio.stickers
          .map((s, i) => `<span style="top:${positions[i][0]}%; inset-inline-start:${positions[i][1]}%; animation-delay:${i * 0.2}s">${s}</span>`)
          .join("");
        p.innerHTML = `
          <div class="notch"></div>
          <div class="label">📱 هاتف البطل عبود</div>
          <div class="stk-layer">${layer}</div>
          <div class="callbtn">📞</div>
        `;
        const cb = p.querySelector(".callbtn");
        cb.onclick = () => { AyaKit.sound.pop(); AyaKit.burst("📞", window.innerWidth / 2, window.innerHeight / 2); };
      }

      function openCert() {
        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.innerHTML = `
          <div class="cert">
            <div class="crown">👑</div>
            <h3>وسام الهاتف الذهبي الساحر</h3>
            <p>تشهد أكاديمية آية بأن بطلنا المبدع قد تعلّم وأتقن كل آداب الاتصال اللطيفة!</p>
            <div class="who"><small>البطل المتوّج:</small>${state.avatar.emoji} ${state.avatar.hero}</div>
            <button class="btn green" id="thanks">شكراً! 🎉</button>
          </div>`;
        document.querySelector(".screen").appendChild(ov);
        ov.querySelector("#thanks").onclick = () => { AyaKit.sound.tap(); ov.remove(); };
      }

      function resetGame() {
        state.screen = "avatar"; state.stars = 0; state.dialed = []; state.tone = 50;
        state.studio = { color: COVER_COLORS[4], stickers: [] };
        render();
      }

      // wire mute + boot
      AyaKit.wireMute($("soundBtn"));
      render();
    </script>
  </body>
</html>
