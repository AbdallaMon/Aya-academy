# nixpacks.toml — server service
[phases.setup]
nixPkgs = ["nodejs_24", "openssl"]   # عدّل نسخة node لنفس اللي بتشغّل بيها محلياً
# نسخة nixpkgs الافتراضية في nixpacks قديمة (أبريل 2025) ومفيهاش nodejs_24،
# و nodejs_22 فيها = 22.11 (أقل من اللي Prisma 7 محتاجه = 22.12).
# بنثبّت snapshot أحدث فيه node 24.5.0 (يوليو 2025) عشان يشتغل مع Prisma 7.
nixpkgsArchive = "372d9eeeafa5b15913201e2b92e8e539ac7c64d1"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run db:generate"]

[start]
cmd = "npm run db:migrate:deploy && npm run start:server"
