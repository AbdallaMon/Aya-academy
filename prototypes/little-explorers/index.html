<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8ef" />
    <meta name="description" content="مغامرتان صغيرتان من أكاديمية آية: اعتنِ بالواحة، وابنِ الكلمات العربية حرفًا حرفًا." />
    <title>مغامرات آية الصغيرة</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%231b6957'/%3E%3Cpath d='m32 10 6 14 16 2-12 11 3 16-13-8-13 8 3-16L10 26l16-2z' fill='%23fbd16d'/%3E%3C/svg%3E" />

    <script defer src="illustrations.js"></script>

  <body>
    <a class="skip-link" href="#main">انتقل إلى اللعبة</a>
    <div class="site-shell">
      <header class="site-header">
        <button class="brand" id="brand" aria-label="أكاديمية آية، العودة إلى المغامرات">
          <span class="brand-mark" aria-hidden="true">آية<span>✦</span></span>

      <main id="main" tabindex="-1"></main>
      <footer class="site-footer"><span>صُنعت بحبّ لأبطال أكاديمية آية</span><span>مساحة تجريبية مستقلة · مغامرتان جديدتان</span></footer>
    </div>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <dialog id="help-dialog" aria-labelledby="help-title"><div id="help-content"></div><button class="button primary" id="close-help">فهمت، هيا نلعب!</button></dialog>
